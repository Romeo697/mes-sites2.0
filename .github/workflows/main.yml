name: Decompresser
on:
  workflow_dispatch:
  push:
    paths: ['*.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in *.zip; do [ -f "$f" ] && unzip -o "$f" && rm "$f"; done
          git config user.name robot
          git config user.email robot@users.noreply.github.com
          git add -A
          git commit -m "Decompression" || echo "Rien a faire"
          git push
