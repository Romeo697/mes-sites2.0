name: Decompresser
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in *.zip; do unzip -o "$f" && rm "$f"; done
          git config user.name robot
          git config user.email robot@users.noreply.github.com
          git add -A && git commit -m "Decompression" && git push
